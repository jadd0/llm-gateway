name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: llm_gateway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateway -d llm_gateway"
          --health-interval 2s --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-retries 15
    env:
      DATABASE_URL: postgres://gateway:gateway@127.0.0.1:5432/llm_gateway
      REDIS_URL: redis://127.0.0.1:6379
      # CI-only throwaway value; real deployments set their own.
      API_KEY_PEPPER: ci-only-pepper-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test
