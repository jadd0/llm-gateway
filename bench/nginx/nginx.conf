# Front for the benchmark cluster: nginx 1.31 run natively (no Docker hop) by bench/cluster.sh.
# cluster.sh copies this file into its run directory with three markers filled in:
#   __LISTEN__    host:port nginx listens on (default 127.0.0.1:8080)
#   __UPSTREAMS__ one `server 127.0.0.1:<port> max_fails=1 fail_timeout=5s;` line per gateway
#   __PREFIX__    the run directory, so pid, logs and temp files stay out of nginx's install
# Choices:
#   least_conn          streams hold a connection for seconds; round robin would pile them on one gateway
#   keepalive           reuses connections to the gateways, so nginx does not pay a TCP handshake per request
#   proxy_buffering off a streamed answer is passed on as it arrives, never held for a full buffer
#   proxy_next_upstream only for connect errors and timeouts: a POST whose bytes reached a gateway is never replayed
#                       (that would double-charge a budget), so a gateway killed mid-run costs its in-flight
#                       requests and nothing after nginx marks it down
worker_processes 2;
daemon off;
pid __PREFIX__/nginx.pid;
error_log __PREFIX__/logs/error.log warn;

events {
  worker_connections 8192;
}

http {
  access_log off;
  client_body_temp_path __PREFIX__/temp/client;
  proxy_temp_path __PREFIX__/temp/proxy;
  fastcgi_temp_path __PREFIX__/temp/fastcgi;
  uwsgi_temp_path __PREFIX__/temp/uwsgi;
  scgi_temp_path __PREFIX__/temp/scgi;
  client_max_body_size 8m;
  # Large enough that a request body is forwarded as it is read, not spooled to disk.
  client_body_buffer_size 1m;

  upstream gateways {
    least_conn;
__UPSTREAMS__
    keepalive 512;
    keepalive_requests 100000;
    keepalive_timeout 60s;
  }

  server {
    listen __LISTEN__ backlog=4096;

    location / {
      proxy_pass http://gateways;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_connect_timeout 2s;
      proxy_next_upstream error timeout;
      proxy_next_upstream_tries 3;
    }
  }
}
